name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n craft.sh

      - name: Run shellcheck
        run: shellcheck craft.sh

      - name: Dry-run smoke test
        run: echo "smoke test" | bash craft.sh --dry-run | jq empty

      - name: Verify version matches tag
        run: |
          SCRIPT_VERSION=$(grep '^readonly VERSION=' craft.sh | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$SCRIPT_VERSION" != "$TAG_VERSION" ]]; then
            echo "ERROR: craft.sh has VERSION=\"$SCRIPT_VERSION\" but tag is $TAG_VERSION"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            craft.sh
