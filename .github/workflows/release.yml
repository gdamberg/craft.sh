name: Release

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Syntax check
        run: bash -n craft.sh

      - name: Run shellcheck
        run: shellcheck craft.sh

      - name: Dry-run smoke test
        run: echo "smoke test" | bash craft.sh --dry-run | jq empty

      - name: Verify version matches tag
        run: |
          SCRIPT_VERSION=$(grep '^readonly VERSION=' craft.sh | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [[ "$SCRIPT_VERSION" != "$TAG_VERSION" ]]; then
            echo "ERROR: craft.sh has VERSION=\"$SCRIPT_VERSION\" but tag is $TAG_VERSION"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            craft.sh

      - name: Update Homebrew formula
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TARBALL_URL="https://github.com/gdamberg/craft.sh/archive/refs/tags/${VERSION}.tar.gz"
          SHA256=$(curl -fsSL "$TARBALL_URL" | shasum -a 256 | awk '{print $1}')

          sed -i "s|url \".*\"|url \"${TARBALL_URL}\"|" Formula/craft-sh.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/craft-sh.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/craft-sh.rb
          git commit -m "Update Homebrew formula to ${VERSION}"
          git push origin main
